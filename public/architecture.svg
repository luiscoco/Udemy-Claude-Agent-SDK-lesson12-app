<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1600" viewBox="0 0 1740 1600"><title>Lesson 12 live configuration, student gate and settings sequence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1740" height="1600" rx="22" fill="#f4f9ff"/><text x="40" y="52" font-family="Arial" font-size="34" font-weight="bold" fill="#101a44">Pause → approve → await controls → release → verify actual effects</text><rect x="20" y="90" width="300" height="80" rx="16" fill="#087fff"/><text x="170" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Student UI</text><path d="M170 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="370" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="520" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Node host</text><path d="M520 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="720" y="90" width="300" height="80" rx="16" fill="#00a977"/><text x="870" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Live Query</text><path d="M870 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1070" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="1220" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Guarded files</text><path d="M1220 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1420" y="90" width="300" height="80" rx="16" fill="#ee5425"/><text x="1570" y="139" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="white">Private settings</text><path d="M1570 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><text x="180" y="227" fill="#142d53" font-family="Arial" font-size="24">1. Validate a fixed classroom experiment</text><path d="M170 245 H520" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="325" fill="#142d53" font-family="Arial" font-size="24">2. Prepare a private project and settings home</text><path d="M520 343 H1570" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="423" fill="#142d53" font-family="Arial" font-size="24">3. Build a typed asynchronous prompt stream</text><path d="M520 441 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="521" fill="#142d53" font-family="Arial" font-size="24">4. Start one live Query object</text><path d="M520 539 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="619" fill="#142d53" font-family="Arial" font-size="24">5. Observe actual turn-one configuration</text><path d="M870 637 H520" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="180" y="717" fill="#142d53" font-family="Arial" font-size="24">6. Wait for the student’s Continue action</text><path d="M170 735 H520" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="815" fill="#142d53" font-family="Arial" font-size="24">7. Switch the model and permission mode</text><path d="M520 833 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="913" fill="#142d53" font-family="Arial" font-size="24">8. Apply settings-file keys at runtime</text><path d="M520 931 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="880" y="1011" fill="#142d53" font-family="Arial" font-size="24">9. Persist local and user settings deliberately</text><path d="M870 1029 H1570" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="1109" fill="#142d53" font-family="Arial" font-size="24">10. Release prompt two after acknowledgements</text><path d="M520 1127 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="1207" fill="#142d53" font-family="Arial" font-size="24">11. Verify the actual file after the live query</text><path d="M520 1225 H1220" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="530" y="1305" fill="#142d53" font-family="Arial" font-size="24">12. Load persisted settings in a fresh query</text><path d="M520 1323 H870" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="180" y="1403" fill="#142d53" font-family="Arial" font-size="24">13. Render results and compare observed turns</text><path d="M520 1421 H170" stroke="#087fff" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>